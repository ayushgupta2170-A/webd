<!DOCTYPE html><!--w3school website-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation ka gyaaan</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
      .container{
        width: 100vw;
        height:100vh ;
        background-color:blanchedalmond;
        border: 5px solid black;
      }
      .box{
         width: 350px;
        height:80px ;
        background-color:cornflowerblue;
        border: 5px solid rgb(50, 205, 55);
        margin: 10px;
        position: relative;
        /*
        animation-name:rightmovement ;
        animation-duration: 10s;
        animation-iteration-count: infinite;
        animation-delay: 2s;
        /*animation: linear;/*maintain same speed*/
        /*animation-timing-function:cubic-bezier(0.175, 0.885, 0.1, 1.75) ;/*many option*/
        /*animation-direction:alternate-reverse;*/
        /*animation-fill-mode: none;

        /*@keyframes duration |  easing fx  |  delay   |  iteration count  |   direction   |  fill mode | 
        playstate  |  name */
        animation: 5s linear 1s infinite alternate none running rightmovement;

        
      }
       @keyframes rightmovement {
        from{
            top:0;
            left: 0;
        }
        to{
            top: 0;
            left: 1350px;
        }
      }



      
      #box2{
        width: 350px;
        height:80px ;
        background-color:cornflowerblue;
        border: 5px solid rgb(50, 205, 55);
        margin: 10px;
        position: relative;

        /*@keyframes duration |  easing fx  |  delay   |  iteration count  |   direction   |  fill mode | 
        playstate  |  name */
        animation: 5s ease-in 1s infinite alternate none running leftmovement;
    }
      @keyframes leftmovement {
        from{
            top:680px;
            left:1350px;
        }
        to{
            top: 680px;
            left: 0px;
        }
      }

      #circle{
        width: 100px;
         height:100px ;
        background-color:cornflowerblue;
        border: 5px solid rgb(50, 205, 55);
        border-radius: 50px;
        margin: 10px;
        position: relative;
        top: 30%;
        left: 675px;
        animation: 10s ease-in-out 0s infinite alternate-reverse none running circlemovement;
        }

         @keyframes circlemovement {
         0%{
            top:1% ;
            left:5% ;
         }
         30%{
             top: 5%;
            left: 90%;
         }
         60%{
             top:75% ;
            left:10% ;}
         100%{
             top:70% ;
            left: 90%;
         }

      }


     </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>

          <div id="circle"></div>


        <div id="box2"></div>

        

       
    </div>

</body>
</html>
