<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid Design</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background-color: rgb(178,178,220);
        }

        .container{
            display:grid;
            min-height:100vh;
            padding:2rem;
            gap:1rem;

            grid-template-columns: repeat(3,1fr);

            grid-template-areas:
            "header header header"
            "sidebaar content1 content1"
            "sidebaar content2 content3"
            "footer footer footer";
        }

        .item{
            border:2px solid black;
            background-color:cornflowerblue;
            color:white;
            padding:1rem;
            font-size:20px;
        }

        #header{
            grid-area:header;
        }

        #sidebaar{
            grid-area:sidebaar;
        }

        #content1{
            grid-area:content1;
        }

        #content2{
            grid-area:content2;
        }

        #content3{
            grid-area:content3;
        }

        #footer{
            grid-area:footer;
        }

       /* @media (max-width:768px){

            .container{

                grid-template-columns:1fr;

                grid-template-areas:
                "header"
                "sidebaar"
                "content1"
                "content2"
                "content3"
                "footer";
            }

        }*/

    </style>
</head>

<body>

<div class="container">

    <div class="item" id="header">Header</div>

    <div class="item" id="sidebaar">Sidebar</div>

    <div class="item" id="content1">Content 1</div>

    <div class="item" id="content2">Content 2</div>

    <div class="item" id="content3">Content 3</div>

    <div class="item" id="footer">Footer</div>

</div>

</body>
</html>
