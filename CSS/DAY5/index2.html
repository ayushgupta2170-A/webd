<!--css size units-->
<!--website to read css-tricks
    %     
    vw,vh
    pixel,physical vs logical px
    ppi vs dpi
    em,rem      ////10 em =10*parent size
                //////5*16=80px
    avoid absolute,use relative units
    responsive design ke liya kya kya use kr skte hi

-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .box{
            border: 2px solid rgb(28, 2, 2);
            width: 25%;
        }
        .parent{
            border: 1px solid black;
            background-color: blueviolet;
            width: 50%;
        }
        .child{
            border: 1px solid green;
            background-color: aqua;
            width: 20%;
        }
        .container{
            border: 1px solid salmon;
            background-color: aqua;
            height: 50vh;
            width: 50vw;
        }
        .box1{
            border: 5px solid black;
            font-size: 70px;
        }
        .container1{
            font-size: 10px;
        }
        .box2{
            font-size: 10em;   
        }
        .firstpara{
            border:1px solid blue ;
            font-size: 5rem;  
        }
    </style>
</head>
<body>
    
    <div class="box">
        welcome to the jungle 
    </div>

    <div class="parent">
    <div class="child">
        child
        </div>
    </div>
    

    <div class="container">
        welcome to coding
    </div>  
    
    <div class="box1">
        bollywood screen
    </div>

    <div class="container1">
        <div class="box2">
            good morning
        </div>
    </div>

    <div class="firstpara">
        hello jiiiiiiiiii
    </div>

</body>  
</html>
