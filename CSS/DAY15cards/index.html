<!DOCTYPE html><!--mdn web docs-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cards</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100%;
            height: 100%;
            min-height: 980px;
            background-color: #88C6EC;
            background-image:linear-gradient(135deg,#8BC6EC 0%,#9599E2 100%) ;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .cards{
            width: 360px;
            height: 600px;
            border-radius: 20px;
            background-color: white;
            display: flex;
            
            flex-direction: column;
            align-items: center;
            gap:30px;
            padding: 20px;
           
        }
        .cards img{
            height: 50%;
            width:300px;
             border-radius: 20px;
        }
        .cards h2{
            font-weight:bold;
            font-size: 1.5rem;
        }
        .cards p{
            font-size: 1.2em;

        }

        

    </style>
</head>
<body>
    <div class="container">
        <div class="cards">
            <img src="qr.jpeg"/>
            <h2>
                improve your skills by taking course of fronted developer
            </h2>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Voluptate omnis praesentium quam accusantium ad.
             Magnam rem debitis vel perferendis recusandae, reiciendis expedita dolorem aliquid sapiente ut vitae adipisci ipsa! Modi.
            </p>
        </div>
    </div>
    
</body>
</html>
