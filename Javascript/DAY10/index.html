<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
      <div class="container">
      <h2>Password Generator</h2>

      <div class="display-container">
                 
        <input readonly placeholder="Password"class="display"data-passwordDisplay>


        <button data-copy>
            <span data-copyMsg></span>
            <img src="./image.png" alt="copy" width="15" height="12">
        </button>



        <div class="input-container">

            <!--password length section-->
         <div class="length-container">
            <p>Password Length</p>
            <p data-lengthNumber>0</p>
         </div>

            <!--slider making-->
            <input type="range" min="1" max="20" class="slider" step="1" data-lengthSlider>

            <!--checkboxes-->
            <div>
                <input type="checkbox" id="uppercase">
                <label for="uppercase">Includes Uppercase Letters</label>
            </div>

            <div>
                <input type="checkbox" id="lowercase">
                <label for="lowercase">Includes Lowercase Letters</label>
            </div>

            <div>
                <input type="checkbox" id="numbers">
                <label for="numbers">Includes Number Letters</label>
            </div>

            <div>
                <input type="checkbox" id="symbol">
                <label for="symbol">Includes Symbols Letters</label>
            </div>


            <!--strength section-->
            <div class="strength-container">
                <p>Strength</p>
                <div data-indicator=""></div>
            </div>

            <!--Password Generaator-->
            <button class="generateButton">Password Generator</button>



      </div>
      </div>
    <script src="index.js"></script>

</body>
</html>
