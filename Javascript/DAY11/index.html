<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ayush.css">
</head>
<body>
    
      <div class="wrapper">

        <h1>WeatherApp</h1>

        <div class="tab-containner">
            <p class="tab">Your Weather</p>
            <p class="tab">Search Weather</p>
        </div>

        <div class="weather-container">
            <!--grant location container-->
            <div class="grant-location-container">
                <img src="./assets/location.png"width="80" height="80" loading="lazy">
                <p>grant location access</p>
                <p>Allow access to get Weather Information</p>
                <button class="btn" data-grantAccess >Grant Access</button>
            </div>

            <!--search form-->
            <form class="form-container" data search form>
                <input placeholder="Search for City...."data-searchInput>
                <button class="btn">
                    <img src="./assets/search.png"width="12" height="12" loading="lazy">
                </button>
            </form>

            <!--loading screen container-->
            <div class="loading-container">
                <img src="https://media4.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3bHRyZjBubDB1aDRtN2d0MW81cDl2M2tvYXR1amVyeWJ0MndrbjF3bSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/xTk9ZvMnbIiIew7IpW/giphy.webp"width="160" height="160" >
                <p>Loading</p>
            </div>

            <!--show weather info-->
            <div class="user-info-container">
                <!--city name flag-->
                <div class="name">
                    <p>data-city-name</p>
                    <img data-countryIcon>
                </div>

                <!--weather description-->
                <p data-weatherDesc></p>
                <!--weatherIcon-->
                <img  data-weatherIcon>
                <!--temperature-->
                <p data-temp></p>

                <!--3 cards parameters-->
            </div>

        </div>

      </div>



    <script src="index.js"></script>

</body>
</html>
